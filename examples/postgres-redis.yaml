# Merge services and volumes into .devcontainer/compose.yaml, retaining tool.
# Add ["postgres", "redis"] to project.json services. The runner creates a
# random TASK_PASSWORD for each task. Neither service publishes a host port.
services:
  tool:
    environment:
      DATABASE_URL: postgresql://dev:${TASK_PASSWORD:?Run scripts/agent-container}@postgres:5432/app
      REDIS_URL: redis://redis:6379
  postgres:
    image: postgres:14@sha256:156f0b253fd61366d5fc2107ad45955027d5612f695a8436ce20167f3fa79bff
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: ${TASK_PASSWORD:?Run scripts/agent-container}
      POSTGRES_DB: app
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      # TCP excludes the temporary Unix-socket server used during first initialization.
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, dev, -d, app]
      interval: 2s
      timeout: 5s
      retries: 60
  redis:
    image: redis:6.2-alpine@sha256:d0c875bdacfb5c4d2c2d9124de3f53cee1dc9ceff8936bd459fabc135cb33015
    command: [redis-server, --save, '']
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 60
volumes:
  postgres:
  redis:
